name: Mobile validation

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # postinstall runs patch-package; a patch that no longer applies fails the install.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Informational: remaining advisories are build-time Expo/Metro tooling with no upstream
      # fix (see docs/qa/MOBILE_DEPENDENCY_TRIAGE.md). Fail only on shipped runtime packages.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
