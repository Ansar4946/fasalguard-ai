name: Production artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example 1.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-artifacts
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Alibaba Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIBABA_REGISTRY }}
          username: ${{ secrets.ALIBABA_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIBABA_REGISTRY_PASSWORD }}
      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: services/api
          target: production
          push: true
          tags: ${{ vars.ALIBABA_REGISTRY }}/${{ vars.ALIBABA_NAMESPACE }}/fasalguard-api:${{ inputs.version }}
      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: services/api
          target: worker
          push: true
          tags: ${{ vars.ALIBABA_REGISTRY }}/${{ vars.ALIBABA_NAMESPACE }}/fasalguard-worker:${{ inputs.version }}
      - name: Build and publish AI service
        uses: docker/build-push-action@v6
        with:
          context: services/geospatial-ai
          push: true
          tags: ${{ vars.ALIBABA_REGISTRY }}/${{ vars.ALIBABA_NAMESPACE }}/fasalguard-ai-service:${{ inputs.version }}

  summary:
    runs-on: ubuntu-24.04
    needs: publish
    steps:
      - run: |
          echo "Images were published only. No migration or deployment was executed." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the reviewed deployment runbook and immutable version ${{ inputs.version }}." >> "$GITHUB_STEP_SUMMARY"
