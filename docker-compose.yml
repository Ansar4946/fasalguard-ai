name: fasalguard
x-app-env: &app-env
  NODE_ENV: development
  PORT: 4000
  DATABASE_URL: postgresql://fasalguard:local-fasalguard-password@postgres:5432/fasalguard
  DATABASE_SSL: "false"
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: info
  ENABLE_SWAGGER: "true"
  CORS_ORIGINS: http://localhost:3000
  ENFORCE_FIELD_WITHIN_FARM: "true"
  JWT_ACCESS_SECRET: local-development-secret-change-before-production
  JWT_ISSUER: fasalguard-api
  JWT_AUDIENCE: fasalguard-clients
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_DAYS: "30"
  OTP_PROVIDER: development
  WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
  PASSWORD_SETUP_TTL_MINUTES: ${PASSWORD_SETUP_TTL_MINUTES:-30}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  OBJECT_STORAGE_PROVIDER: local-disk
  MEDIA_LOCAL_DIR: /data/media
  API_PUBLIC_URL: http://localhost:4000/api/v1
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  SENTINEL_HUB_CLIENT_ID: ${SENTINEL_HUB_CLIENT_ID:-}
  SENTINEL_HUB_CLIENT_SECRET: ${SENTINEL_HUB_CLIENT_SECRET:-}
  SENTINEL_HUB_BASE_URL: ${SENTINEL_HUB_BASE_URL:-https://services.sentinel-hub.com}
  SENTINEL_HUB_AUTH_URL: ${SENTINEL_HUB_AUTH_URL:-https://services.sentinel-hub.com/auth/realms/main/protocol/openid-connect/token}
  WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
  OPEN_METEO_BASE_URL: https://api.open-meteo.com
  OPENWEATHERMAP_BASE_URL: https://api.openweathermap.org
  OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
  WEATHER_CACHE_TTL_SECONDS: 900
  WEATHER_ALERT_MIN_INTERVAL_HOURS: ${WEATHER_ALERT_MIN_INTERVAL_HOURS:-12}
  VISION_PROVIDER: ${VISION_PROVIDER:-self-hosted}
  SELF_HOSTED_VISION_URL: ${SELF_HOSTED_VISION_URL:-http://geospatial-ai:8000}
  ROBOFLOW_BASE_URL: ${ROBOFLOW_BASE_URL:-https://serverless.roboflow.com}
  ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
  ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-}
  ROBOFLOW_MODEL_VERSION: ${ROBOFLOW_MODEL_VERSION:-}
  ROBOFLOW_MODEL_TASK: ${ROBOFLOW_MODEL_TASK:-classification}
  VISION_MODEL_PATH: ${VISION_MODEL_PATH:-/models/cotton-disease.onnx}
  VISION_MODEL_MANIFEST_PATH: ${VISION_MODEL_MANIFEST_PATH:-/models/cotton-disease.json}
  VISION_MINIMUM_CONFIDENCE: 0.65
  VISION_EXPERT_REVIEW_BELOW: 0.85
  QWEN_BASE_URL: https://dashscope-intl.aliyuncs.com
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_MODEL: qwen-plus
  FARM_BRAIN_PROVIDER: ${FARM_BRAIN_PROVIDER:-fake}
  GEMINI_TRANSPORT: google-ai
  GEMINI_MODEL: gemini-3.6-flash
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  SATELLITE_MAX_CLOUD_COVERAGE: "30"
  GEOSPATIAL_AI_URL: http://geospatial-ai:8000
  AMIS_SYNC_ENABLED: ${AMIS_SYNC_ENABLED:-false}
  AMIS_SCRAPE_TIMEOUT_MS: ${AMIS_SCRAPE_TIMEOUT_MS:-120000}
  MARKET_CACHE_TTL_SECONDS: ${MARKET_CACHE_TTL_SECONDS:-3600}
  SATELLITE_MONITORING_INTERVAL_HOURS: "8"
  SATELLITE_PROVIDER_REQUESTS_PER_MINUTE: "30"
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      {
        POSTGRES_DB: fasalguard,
        POSTGRES_USER: fasalguard,
        POSTGRES_PASSWORD: local-fasalguard-password,
      }
    ports: ["5432:5432"]
    volumes:
      [
        "postgres_data:/var/lib/postgresql/data",
        "./services/api/docker/postgres/init:/docker-entrypoint-initdb.d:ro",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U fasalguard -d fasalguard && psql -U fasalguard -d fasalguard -tAc "SELECT 1 FROM pg_extension WHERE extname=''postgis''" | grep -q 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    restart: unless-stopped
  media-init:
    image: node:22-alpine
    command: ["sh", "-c", "mkdir -p /data/media && chown -R node:node /data/media"]
    volumes: ["media_data:/data/media"]
    restart: "no"
  api:
    build: { context: ./services/api, target: production }
    environment: *app-env
    ports: ["4000:4000"]
    volumes: ["media_data:/data/media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      media-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    init: true
    restart: unless-stopped
  worker:
    build: { context: ./services/api, target: worker }
    environment: *app-env
    volumes: ["media_data:/data/media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      media-init: { condition: service_completed_successfully }
    init: true
    restart: unless-stopped
  geospatial-ai:
    build: { context: ./services/geospatial-ai }
    ports: ["8000:8000"]
    environment:
      AMIS_SCRAPER_ENABLED: ${AMIS_SYNC_ENABLED:-false}
      AMIS_BASE_URL: ${AMIS_BASE_URL:-http://www.amis.pk}
      AMIS_TIMEOUT_SECONDS: ${AMIS_TIMEOUT_SECONDS:-30}
      AMIS_REQUEST_DELAY_SECONDS: ${AMIS_REQUEST_DELAY_SECONDS:-1}
      VISION_MODEL_PATH: ${VISION_MODEL_PATH:-/models/cotton-disease.onnx}
      VISION_MODEL_MANIFEST_PATH: ${VISION_MODEL_MANIFEST_PATH:-/models/cotton-disease.json}
    volumes:
      - ./services/geospatial-ai/models:/models:ro
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 10,
      }
    restart: unless-stopped
  migrate:
    build: { context: ./services/api, target: production }
    command: ["npm", "run", "migration:run:prod"]
    environment:
      DATABASE_URL: postgresql://fasalguard:local-fasalguard-password@postgres:5432/fasalguard
      DATABASE_SSL: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
volumes:
  postgres_data:
  redis_data:
  media_data:
